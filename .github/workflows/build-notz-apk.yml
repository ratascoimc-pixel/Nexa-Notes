name: Build NOTZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NOTZ-v1.4.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOTZ-v1.4-Android
          path: NOTZ-v1.4.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete notz-v1.4-test --yes --cleanup-tag || true
          gh release create notz-v1.4-test NOTZ-v1.4.apk --title "NOTZ v1.4 Android Test" --notes "Installable Android test build of NOTZ by Master Key One."
