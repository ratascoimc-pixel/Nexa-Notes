name: Build NOTZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_API_BASE_URL: https://nexa-notes.onrender.com
      EXPO_PUBLIC_SUPABASE_URL: https://nrkbhjqiagvxtcmyusne.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_7_cD6mH0q4PpRle9_MrTfQ_aZwqiAvt
      CI: 1
      NODE_ENV: production
      NPM_CONFIG_LEGACY_PEER_DEPS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Restore NOTZ beta signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: notz-beta-signing-key-v1

      - name: Create NOTZ beta signing key
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NOTZ Beta,O=Master Key One,C=US" -noprompt

      - name: Install Expo-compatible dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test transcription recovery
        run: node tests/transcription.cjs && node tests/rename.cjs && node tests/shared-cloud.cjs && node tests/conversation.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Use persistent NOTZ signing key
        run: |
          cp ~/.android/debug.keystore android/app/debug.keystore
          ls -l android/app/debug.keystore

      - name: Set increasing Android version code
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          run_number = os.environ['GITHUB_RUN_NUMBER']
          s, n = re.subn(r'versionCode\s+\d+', f'versionCode {1000 + int(run_number)}', s, count=1)
          if n != 1:
              raise SystemExit('Could not set Android versionCode')
          p.write_text(s)
          print('Android versionCode set to', run_number)
          PY

      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NOTZ-sharing-preview.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOTZ-sharing-preview-Android
          path: NOTZ-sharing-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable test download
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'notz-apk-test' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete notz-sharing-preview --yes --cleanup-tag || true
          gh release create notz-sharing-preview NOTZ-sharing-preview.apk --target "$GITHUB_SHA" --title "NOTZ Shared Notes and Conversation Preview" --notes "NOTZ 1.6.0: Shared Notes with account sign-in, viewer/editor access, revision conflict protection, and online refresh. Conversation separates voices from saved audio with speaker labels, timestamps, and PDF export. Labels restart per audio part. Sharing is an early preview: save before leaving; offline drafts are not queued. This APK installs separately as NOTZ Preview. It does not replace your existing NOTZ app or import its local recordings. Keep the working app installed."
